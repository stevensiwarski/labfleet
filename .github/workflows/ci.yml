name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go build ./...
      - run: go test ./...
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - run: go vet ./...
