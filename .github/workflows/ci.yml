name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: go build ./...
      - run: go test ./...
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - run: go vet ./...

  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/opentofu
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu validate
      - run: tofu test
      - name: Validate persistent provisioning infrastructure
        working-directory: infra/opentofu/provisioner
        run: |
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
          tofu test
