---
- name: Export admin access only from an attested Issue 8 control plane
  hosts: labfleet_nodes
  gather_facts: false
  become: false
  any_errors_fatal: true
  pre_tasks:
    - name: Attest every cluster member before exporting credentials
      ansible.builtin.import_role:
        name: kubernetes_safety
  tasks:
    - name: Require private controller destination
      ansible.builtin.assert:
        that:
          - cluster_kubeconfig_path is defined
          - cluster_kubeconfig_path is match('^/')
          - cluster_kubeconfig_path | basename == 'issue8.kubeconfig'
        quiet: true
      run_once: true
    - name: Create private controller directory
      ansible.builtin.file:
        path: "{{ cluster_kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true
    - name: Read admin kubeconfig without logging certificate material
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      become: true
      register: cluster_admin_config
      when: inventory_hostname == groups.labfleet_control_plane[0]
      no_log: true
    - name: Store admin kubeconfig privately on controller
      ansible.builtin.copy:
        content: "{{ cluster_admin_config.content | b64decode }}"
        dest: "{{ cluster_kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      when: inventory_hostname == groups.labfleet_control_plane[0]
      no_log: true
      diff: false
