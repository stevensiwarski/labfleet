---
- name: Refresh apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
    update_cache_retries: 5
    update_cache_retry_max_delay: 12

- name: Apply configured safe package upgrade
  ansible.builtin.apt:
    upgrade: "{{ base_apt_upgrade }}"
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  register: base_upgrade_result
  retries: 3
  delay: 10
  until: base_upgrade_result is succeeded

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  register: base_packages_result
  retries: 3
  delay: 10
  until: base_packages_result is succeeded

- name: Report pending reboot requirement without rebooting
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Explain pending reboot requirement
  ansible.builtin.debug:
    msg: "A reboot is required on {{ inventory_hostname }}; this playbook will not reboot nodes automatically."
  when: base_reboot_required.stat.exists
