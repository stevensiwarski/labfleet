---
- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Ubuntu containerd package
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 180
  register: containerd_containerd_package
  retries: 3
  delay: 10
  until: containerd_containerd_package is succeeded

- name: Detect installed containerd binary
  ansible.builtin.stat:
    path: /usr/bin/containerd
  register: containerd_containerd_binary

- name: Read installed containerd version
  ansible.builtin.command:
    argv:
      - containerd
      - --version
  register: containerd_containerd_version
  changed_when: false
  check_mode: false
  when: containerd_containerd_binary.stat.exists

- name: Select containerd configuration major
  ansible.builtin.set_fact:
    containerd_config_major: >-
      {{ (containerd_containerd_version.stdout | regex_findall('containerd.* ([0-9]+)[.][0-9]+[.][0-9]+') | first)
      if containerd_containerd_binary.stat.exists else '2' }}

- name: Require supported containerd version
  ansible.builtin.assert:
    that:
      - containerd_config_major in ['1', '2']
      - >-
        containerd_config_major != '1' or containerd_containerd_version.stdout is
        search('containerd.* 1[.]7[.][0-9]+(?:[-+ ]|$)')
      - >-
        containerd_config_major != '2' or containerd_containerd_version.stdout is
        search('containerd.* 2[.]2[.][0-9]+(?:[-+ ]|$)')
    fail_msg: >-
      This role supports containerd 1.7 and 2.2; found
      {{ containerd_containerd_version.stdout | default('no installed binary (check mode assumes 2.x)') }}
      on {{ inventory_hostname }}.
  when: containerd_containerd_binary.stat.exists

- name: Configure containerd CRI and systemd cgroups
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ containerd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

- name: Apply containerd configuration
  ansible.builtin.meta: flush_handlers

- name: Check containerd CRI plugin health
  ansible.builtin.command:
    argv:
      - ctr
      - plugins
      - ls
  register: containerd_containerd_plugins
  changed_when: false
  when: not ansible_check_mode

- name: Require healthy containerd CRI plugin
  ansible.builtin.assert:
    that:
      - >-
        (containerd_containerd_plugins.stdout is search('(?m)^io[.]containerd[.]grpc[.]v1 +cri +.* +ok *$')
        if containerd_config_major == '1' else
        containerd_containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +images +.* +ok *$') and
        containerd_containerd_plugins.stdout is search('(?m)^io[.]containerd[.]cri[.]v1 +runtime +.* +ok *$'))
    fail_msg: "containerd CRI plugin(s) are not healthy on {{ inventory_hostname }}."
  when: not ansible_check_mode
